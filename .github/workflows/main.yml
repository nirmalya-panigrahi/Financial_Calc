name: Build and Release (Windows)

on:
  push:
    tags:
      - "v*"          # e.g. git tag v1.0.0 && git push origin v1.0.0
  workflow_dispatch:   # manual test build (artifact only, no release)

permissions:
  contents: write      # needed to create the GitHub Release

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests

      - name: Build executable
        run: python build_app.py

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "dist/Financial Calculator.exe" -DestinationPath "Financial-Calculator-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Financial-Calculator-windows
          path: Financial-Calculator-windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Financial-Calculator-windows.zip
          generate_release_notes: true
